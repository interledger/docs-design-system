name: Publish to npm

# Publishes a new version of the package to npm whenever the version in
# package.json changes on main.

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # mint the OIDC token used for npm trusted publishing

jobs:
  publish:
    if: github.repository == 'interledger/docs-design-system'
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and check formatting
        run: pnpm run lint

      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # No NPM_TOKEN: npm authenticates via OIDC trusted publishing and
      # attaches provenance automatically.
      - name: Publish package to npm
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public
